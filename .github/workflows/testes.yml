name: Testes e avaliação do acervo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente-acervo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agente-acervo/requirements.txt
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Testes (sem chave de API — o modelo é simulado)
        run: pytest -q
      - name: Avaliação da busca (gabarito de exemplo)
        run: |
          python avaliar.py --versao v1
          python avaliar.py --versao v2
