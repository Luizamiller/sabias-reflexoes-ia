[project]
name = "acervo-backend"
version = "2.0.0"
description = "Às Sábias Reflexões — acervo de podcast com transcrição, conteúdo revisado, busca híbrida e RAG com citações."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.0.44",
    "alembic>=1.17",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.33",
    "anthropic>=2.3.0",
    "httpx>=0.28",
    "scikit-learn>=1.6",
    "numpy>=2.1",
    "cryptography>=46",
    "imageio-ffmpeg>=0.6",
]

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
